name: ci

# Push/PR gate for @crit-fumble/react.
#
# This repo previously had NO push or PR workflow at all — `release.yml` was the only automation, it
# ran on tag push only, and it gated on a typecheck alone. There was no `test` script to run.
#
# The sibling `cfg-threejs` learned this the expensive way: its `test.yml` header records two camera
# regressions that reached a published package before a push/PR gate existed. This package is
# consumed the same way — published to GitHub Packages, pulled by PlayTable and the FoundryVTT
# plugin — so a break here is only discovered downstream, after a publish.
#
# So: everything a release gates on runs here first, on every push and PR.

on:
  push:
    branches: ['main', 'staging', 'next']
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `build` is a distinct signal from `typecheck`: it is what `prepublishOnly` runs, so it
      # catches emit-only failures (declaration emit, rootDir escapes) that `--noEmit` never sees.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ── THE ONLY REQUIRED CONTEXT ─────────────────────────────────────────────
  # Branch protection requires `CI Gate` and nothing else, so renaming or
  # splitting the job above needs no branch-protection change.
  # `if: always()` — without it the gate is SKIPPED on a failed dependency,
  # which reports as neither pass nor fail and hangs the PR.
  # SKIPPED is success; only `failure` and `cancelled` fail the gate.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any required job failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail
          echo "$RESULTS"
          BAD=$(printf '%s' "$RESULTS" | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')
          if [ -n "$BAD" ]; then
            echo "::error::CI Gate FAILED — these jobs did not pass:"
            # shellcheck disable=SC2086  # deliberate word-split — one job per line
            printf '  %s\n' $BAD
            exit 1
          fi
          echo "✓ CI Gate: nothing failed"
