name: release

# Build + publish @crit-fumble/react to GitHub Packages on `v*` tag push.
#
# Matches the release-pipeline contract used by the sibling cfg-* product
# repos (cfg-core-server, cfg-core-browser, cfg-server-disrecord): tag
# pushes are the canonical release trigger, manual `workflow_dispatch`
# stays available for one-off rebuilds. Consumers pull from
# `npm.pkg.github.com` via the `.npmrc` shipped here and in each
# consumer.
#
# Push/PR gating lives in `ci.yml`. This workflow re-runs the same checks
# because a tag can be pushed from any commit, including one that never
# went through a PR.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.0.1). Only used for naming when run manually.'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@crit-fumble'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # `prepublishOnly` runs `clean && build` so `dist/` is produced as
      # part of the publish step itself. No separate build step needed.
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
